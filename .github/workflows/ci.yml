name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/guildhall_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guildhall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d guildhall_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format M1.2 team slice once
        if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/m0-foundation'
        run: |
          pnpm exec prettier --write             apps/server/src/app.ts             apps/server/src/db/schema.ts             apps/server/test/command.test.ts             apps/server/test/postgres-store.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/app.ts apps/server/src/db/schema.ts apps/server/test/command.test.ts apps/server/test/postgres-store.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format M1.2 team slice"
            git push origin HEAD:chatgpt/m0-foundation
          fi

      - name: Migrate test database
        run: pnpm --filter @idle/server db:migrate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Chromium golden battle
        run: |
          pnpm --filter @idle/web exec vite ../../packages/game-core --host 127.0.0.1 --port 5174 --strictPort > /tmp/golden-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5174/browser-golden.html >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/golden-vite.log
            exit 1
          fi
          pnpm --filter @idle/inspect golden:battle

      - name: Build
        run: pnpm build

      - name: Validate Docker Compose
        run: docker compose -f infra/docker-compose.yml config --quiet

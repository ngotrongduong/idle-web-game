name: Format team slice once
# temporary formatter; remove after one successful run

on:
  push:
    branches:
      - chatgpt/m0-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m0-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed team files
        run: |
          pnpm exec prettier --write             apps/server/src/app.ts             apps/server/src/db/schema.ts             apps/server/test/command.test.ts             apps/server/test/postgres-store.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/app.ts apps/server/src/db/schema.ts apps/server/test/command.test.ts apps/server/test/postgres-store.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format M1.2 team slice"
          git push origin HEAD:chatgpt/m0-foundation
